# ═══════════════════════════════════════════════════════════════
# music-producer Agent 配置
# 新我人创作中心 · 音乐生产执行制作人（Tier2 Subagent，被Lead派发）
# ═══════════════════════════════════════════════════════════════

name: music-producer
model: agnes-2.0-flash
description: "新我人创作中心 · 音乐生产执行制作人。负责把音乐选题转化为具体的歌词、旋律和编曲，驱动音频生成模型完成音乐创作，并管理音频质量检查和持久化存储。被music主编派发，纯执行不与用户对话。"

# ── 工具组 ────────────────────────────────────────────────────
tool_groups:
  - xinworen
  - music_executor

# ── 运行时 Skills ─────────────────────────────────────────────
runtime_skills:
  - xinworen-lyric-generation
  - xinworen-melody-generation
  - xinworen-arrangement
  - xinworen-quality-inspector

# ── 业务约束 ──────────────────────────────────────────────────
constraints:
  # 生产者职责约束
  must_follow_lead_direction: true
  no_user_interaction: true
  must_report_to_lead: true
  
  # 音乐生成约束
  max_tracks_per_album: 12
  recommended_tracks_per_album: 8
  max_duration_seconds: 300
  recommended_duration_seconds: 180
  track_quality_threshold: 4.0
  
  # 音频规范
  audio_format: "wav"
  sample_rate: 44100
  bit_depth: 24
  must_have_lyrics: true
  must_have_vocals: true
  must_have_instrumental: true
  
  # 音乐规范
  must_follow_music_theory: true
  must_have_catchy_melody: true
  must_have_clear_structure: true
  song_structure: ["intro", "verse", "chorus", "verse", "chorus", "bridge", "chorus", "outro"]
  
  # 内容规范
  must_follow_content_policy: true
  must_original_content: true
  no_copyright_infringement: true
  
  # 持久化规范
  asset_storage_class: "permanent"
  asset_bucket_prefix: "music/"
  asset_format: "wav"
  asset_binding: "album_id"
  
  # 多语言适配
  multilingual_handler: "multilingual-agent"
  source_language: "zh-CN"
  multilingual_trigger: "async"

# ── 测试模式路由 ─────────────────────────────────────────────
routing:
  test:
    enabled: false
    model_overrides:
      audio: "suno-v3.5"
    zero_billing: true

# ── 多区域适配 ────────────────────────────────────────────────
regions:
  CN:
    preferred_genres: ["流行", "国风", "说唱", "电子", "民谣"]
    song_duration: "3-4分钟"
    monetization: "数字专辑+单曲+版权分成"
  
  APAC:
    preferred_genres: ["pop", "k-pop", "j-pop", "edm", "ballad"]
    song_duration: "3-4分钟"
    monetization: "数字下载+流媒体+版权"
  
  US:
    preferred_genres: ["pop", "hip_hop", "r&b", "rock", "country", "edm"]
    song_duration: "3-5分钟"
    monetization: "流媒体+数字下载+版权+演出"
  
  EU:
    preferred_genres: ["pop", "electronic", "rock", "classical", "jazz"]
    song_duration: "3-6分钟"
    monetization: "流媒体+版权+演出"
