# ═══════════════════════════════════════════════════════════════
# comics Agent 配置
# 新我人创作中心 · 漫画频道主编（Tier1 Lead Agent）
# ═══════════════════════════════════════════════════════════════

name: comics
model: agnes-2.0-flash
description: "新我人创作中心 · 漫画频道主编。负责漫画内容的选题策划、分镜设计、角色设计、画面生成和后期制作，对标快看漫画/腾讯动漫的AI创作能力。管理comics-executor和comic-producer两个子Agent。"

# ── 工具组 ────────────────────────────────────────────────────
tool_groups:
  - xinworen
  - content_creation
  - image_generation

# ── 运行时 Skills ─────────────────────────────────────────────
runtime_skills:
  - xinworen-comic-planning
  - xinworen-storyboard-design
  - xinworen-character-design
  - xinworen-quality-inspector

# ── 业务约束 ──────────────────────────────────────────────────
constraints:
  # 漫画创作规范
  max_chapters_per_comic: 100
  recommended_chapters: 30
  max_panels_per_chapter: 20
  recommended_panels_per_chapter: 12
  max_characters: 8
  recommended_characters: 5
  
  # 画面规范
  image_resolution: "1024x1536"
  image_style: "manga"
  character_consistency_threshold: 4.5
  scene_consistency_threshold: 4.0
  
  # 内容规范
  must_follow_content_policy: true
  must_original_content: true
  no_copyright_infringement: true
  
  # 多语言适配
  multilingual_handler: "multilingual-agent"
  source_language: "zh-CN"
  multilingual_trigger: "async"
  
  # 发布规范
  auto_publish: false
  require_human_review: true

# ── 测试模式路由 ─────────────────────────────────────────────
routing:
  test:
    enabled: false
    model_overrides:
      image: "agnes-image-2.1-flash"
    zero_billing: true

# ── 多区域适配 ────────────────────────────────────────────────
regions:
  CN:
    preferred_styles: ["国漫", "日漫", "韩漫"]
    preferred_genres: ["热血", "恋爱", "悬疑", "玄幻", "都市"]
    update_frequency: "每周1-2更"
    monetization: "付费章节+广告+周边"
    platform: "快看漫画/腾讯动漫/哔哩哔哩漫画"
  
  APAC:
    preferred_styles: ["manga", "manhwa", "manhua"]
    preferred_genres: ["romance", "fantasy", "action", "horror"]
    update_frequency: "每周1更"
    monetization: "付费+订阅"
    platform: "Webtoon/Kakao/Line Manga"
  
  US:
    preferred_styles: ["american_comic", "manga", "graphic_novel"]
    preferred_genres: ["superhero", "sci_fi", "fantasy", "horror", "crime"]
    update_frequency: "每月1-2更"
    monetization: "单刊+合订本+数字订阅"
    platform: "Marvel/DC/Image/ComiXology"
  
  EU:
    preferred_styles: ["bande_dessinee", "graphic_novel", "manga"]
    preferred_genres: ["crime", "historical", "sci_fi", "fantasy"]
    update_frequency: "每月1更"
    monetization: "精装+平装+数字"
    platform: "Dargaud/Dupuis/Cinebook"

# ── 分级标准 ──────────────────────────────────────────────────
rating:
  tiers:
    S:
      label: "头部爆款"
      criteria: "IP改编潜力，S级画师，全平台分发"
    A:
      label: "优质作品"
      criteria: "高概念题材，强画面质量"
    B:
      label: "腰部作品"
      criteria: "标准题材，单平台分发"
    C:
      label: "测试作品"
      criteria: "AI全流程生成，测试新题材"
  dimensions:
    art_quality: 30
    story_rhythm: 25
    character_design: 20
    producibility: 15
    compliance: 10

# ── XinWoRen Skill 标准化元数据（P3 横向复制，2026-09-04）──────────────
# 规范：devops/docs/skill-standardization-spec-260904.md（参考模板 = interactive）
xwr:
  schema_version: 1
  domain: creative
  tier: lead
  channel: comic
  capabilities:
    image: true
  # 无视频生成链路：不声明 models.video（video 能力一旦声明则 supported 必须非空）
  startup_questions:
    - "题材与画风（constraints.image_style 默认 manga，可改其他）？"
    - "章节数（建议 30，上限 100）与每话格数（建议 12，上限 20）？"
    - "角色数量（建议 5，上限 8），是否复用资产中心已有角色？"
    - "画面分辨率与一致性阈值是否沿用默认（1024x1536 / 角色 4.5）？"

# ── XinWoRen Skill 标准化元数据（P3 横向复制，2026-09-04）──────────────
# 规范：devops/docs/skill-standardization-spec-260904.md（参考模板 = interactive）
xwr:
  schema_version: 1
  domain: creative
  tier: lead
  channel: comic
  capabilities:
    image: true
  # 无视频生成链路：不声明 models.video（声明了则必须给出非空 supported）
  startup_questions:
    - "题材与画风（constraints.image_style 默认 manga，可指定其他）？"
    - "章节数（建议 30，上限 100）与每话格数（建议 12，上限 20）？"
    - "角色数量（建议 5，上限 8），是否复用资产中心已有角色？"
    - "画面规格沿用默认（1024x1536 / 角色一致性阈值 4.5）？"
