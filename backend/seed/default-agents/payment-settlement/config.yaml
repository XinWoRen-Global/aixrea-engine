# ═══════════════════════════════════════════════════════════════
# payment-settlement Agent 配置
# 新我人商城交易域 · 支付结算主编（Tier1 Lead Agent）
# ═══════════════════════════════════════════════════════════════

name: payment-settlement
model: agnes-2.0-flash
description: "新我人商城交易域 · 支付结算主编。负责支付通道管理、支付路由、交易对账、资金结算和分润计算，管理Stripe/Antom双通道和创作者70%收益分成，对标Stripe/PayPal的支付管理能力。管理支付路由、对账结算两个子Agent。"

# ── 工具组 ────────────────────────────────────────────────────
tool_groups:
  - xinworen
  - marketplace
  - payment_management

# ── 运行时 Skills ─────────────────────────────────────────────
runtime_skills:
  - xinworen-payment-routing
  - xinworen-transaction-reconciliation
  - xinworen-settlement-calculation
  - xinworen-revenue-sharing

# ── 业务约束 ──────────────────────────────────────────────────
constraints:
  # 支付通道规范
  payment_providers: ["stripe", "antom"]
  default_provider: "stripe"
  cn_preferred_provider: "antom"
  global_preferred_provider: "stripe"
  auto_failover_enabled: true
  
  # 支付方式
  payment_methods: ["credit_card", "wechat_pay", "alipay", "apple_pay", "google_pay"]
  subscription_methods: ["credit_card"]
  
  # 分润规范
  creator_revenue_share: 0.70
  platform_revenue_share: 0.30
  settlement_cycle_days: 30
  min_settlement_amount_usd: 10.00
  
  # 对账规范
  auto_reconciliation_enabled: true
  reconciliation_threshold_usd: 0.01
  must_match_transactions: true
  
  # 风控规范
  fraud_detection_enabled: true
  high_risk_transaction_review: true
  max_transaction_amount_usd: 10000.00
  
  # 多语言适配
  multilingual_handler: "multilingual-agent"
  source_language: "zh-CN"
  multilingual_trigger: "async"

# ── 测试模式路由 ─────────────────────────────────────────────
routing:
  test:
    enabled: false
    model_overrides:
      text: "deepseek-v4-flash"
    zero_billing: true

# ── 多区域适配 ────────────────────────────────────────────────
regions:
  CN:
    preferred_provider: "antom"
    payment_methods: ["wechat_pay", "alipay", "credit_card"]
    currency: "CNY"
    settlement_cycle_days: 15
  
  APAC:
    preferred_provider: "antom"
    payment_methods: ["credit_card", "alipay", "local_wallets"]
    currency: "USD"
    settlement_cycle_days: 30
  
  US:
    preferred_provider: "stripe"
    payment_methods: ["credit_card", "apple_pay", "google_pay"]
    currency: "USD"
    settlement_cycle_days: 30
  
  EU:
    preferred_provider: "stripe"
    payment_methods: ["credit_card", "apple_pay", "google_pay", "sepa"]
    currency: "EUR"
    settlement_cycle_days: 30
