# ═══════════════════════════════════════════════════════════════
# data-intelligence Agent 配置
# 新我人数据智能域 · 数据智能主编（Tier1 Lead Agent）
# ═══════════════════════════════════════════════════════════════

name: data-intelligence
model: agnes-2.0-flash
description: "新我人数据智能域 · 数据智能主编。负责数据采集、数据分析、报表生成、趋势预测和智能推荐，管理全平台数据资产和AI驱动的决策支持，对标字节跳动/谷歌的数据智能能力。"

# ── 工具组 ────────────────────────────────────────────────────
tool_groups:
  - xinworen
  - data_analytics
  - business_intelligence

# ── 运行时 Skills ─────────────────────────────────────────────
runtime_skills:
  - xinworen-data-collection
  - xinworen-data-analysis
  - xinworen-reporting
  - xinworen-predictive-analytics
  - xinworen-recommendation-engine

# ── 业务约束 ──────────────────────────────────────────────────
constraints:
  # 数据规范
  data_quality_threshold: 0.95
  must_have_data_lineage: true
  must_comply_with_gdpr: true
  must_comply_with_ccpa: true
  data_retention_days: 365
  
  # 数据采集
  collection_sources: ["website", "app", "api", "third_party", "payment"]
  real_time_collection_enabled: true
  batch_collection_enabled: true
  
  # 数据分析
  analysis_dimensions: ["user", "content", "transaction", "distribution", "marketing"]
  must_provide_insights: true
  must_identify_anomalies: true
  
  # 报表规范
  report_frequency: ["daily", "weekly", "monthly"]
  auto_report_generation_enabled: true
  must_visualize_data: true
  
  # 预测规范
  prediction_horizon_days: [7, 30, 90]
  prediction_accuracy_threshold: 0.80
  must_provide_confidence_interval: true
  
  # 推荐规范
  recommendation_enabled: true
  personalization_enabled: true
  must_provide_explanations: true
  a_b_testing_enabled: true
  
  # 多语言适配
  multilingual_handler: "multilingual-agent"
  source_language: "zh-CN"
  multilingual_trigger: "async"

# ── 测试模式路由 ─────────────────────────────────────────────
routing:
  test:
    enabled: false
    model_overrides:
      text: "deepseek-v4-flash"
    zero_billing: true

# ── 多区域适配 ────────────────────────────────────────────────
regions:
  CN:
    data_residency: "中国大陆"
    privacy_law: "个人信息保护法"
    analytics_platforms: ["百度统计", "友盟", "神策数据"]
  
  APAC:
    data_residency: "新加坡"
    privacy_law: "PDPA"
    analytics_platforms: ["Google Analytics", "Mixpanel", "Amplitude"]
  
  US:
    data_residency: "美国"
    privacy_law: "CCPA/COPPA"
    analytics_platforms: ["Google Analytics", "Mixpanel", "Amplitude", "Segment"]
  
  EU:
    data_residency: "欧盟"
    privacy_law: "GDPR"
    analytics_platforms: ["Google Analytics", "Mixpanel", "Plausible"]
