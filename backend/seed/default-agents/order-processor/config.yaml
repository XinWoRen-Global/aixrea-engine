# ═══════════════════════════════════════════════════════════════
# order-processor Agent 配置
# 新我人商城交易域 · 订单处理主编（Tier1 Lead Agent）
# ═══════════════════════════════════════════════════════════════

name: order-processor
model: agnes-2.0-flash
description: "新我人商城交易域 · 订单处理主编。负责订单的创建、确认、履约、跟踪和完成，管理订单状态机和异常订单处理，对标亚马逊/Shopify的订单管理能力。管理订单履约、异常订单处理两个子Agent。"

# ── 工具组 ────────────────────────────────────────────────────
tool_groups:
  - xinworen
  - marketplace
  - order_management

# ── 运行时 Skills ─────────────────────────────────────────────
runtime_skills:
  - xinworen-order-creation
  - xinworen-order-fulfillment
  - xinworen-order-tracking
  - xinworen-exception-handling

# ── 业务约束 ──────────────────────────────────────────────────
constraints:
  # 订单处理规范
  max_orders_per_day: 10000
  order_timeout_minutes: 30
  auto_confirm_enabled: true
  auto_fulfillment_enabled: true
  
  # 订单状态机
  order_states: ["pending", "confirmed", "paid", "fulfilling", "completed", "cancelled", "refunded"]
  must_follow_state_transition: true
  no_state_skip: true
  
  # 数字商品履约
  digital_delivery_instant: true
  must_generate_license_key: true
  must_send_delivery_notification: true
  
  # 异常处理
  auto_cancel_timeout_orders: true
  auto_refund_failed_orders: true
  must_log_all_state_changes: true
  
  # 多语言适配
  multilingual_handler: "multilingual-agent"
  source_language: "zh-CN"
  multilingual_trigger: "async"

# ── 测试模式路由 ─────────────────────────────────────────────
routing:
  test:
    enabled: false
    model_overrides:
      text: "deepseek-v4-flash"
    zero_billing: true

# ── 多区域适配 ────────────────────────────────────────────────
regions:
  CN:
    order_timeout_minutes: 15
    delivery_method: "即时到账"
    customer_support_hours: "24/7"
  
  APAC:
    order_timeout_minutes: 30
    delivery_method: "instant_delivery"
    customer_support_hours: "24/7"
  
  US:
    order_timeout_minutes: 60
    delivery_method: "instant_delivery"
    customer_support_hours: "24/7"
  
  EU:
    order_timeout_minutes: 60
    delivery_method: "instant_delivery"
    customer_support_hours: "24/7"
