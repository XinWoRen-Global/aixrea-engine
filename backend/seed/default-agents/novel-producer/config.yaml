# ═══════════════════════════════════════════════════════════════
# novel-producer Agent 配置
# 新我人创作中心 · 小说生产执行编辑（Tier2 Subagent，被Lead派发）
# ═══════════════════════════════════════════════════════════════

name: novel-producer
model: agnes-2.0-flash
description: "新我人创作中心 · 小说生产执行编辑。负责把小说大纲转化为具体的章节内容，驱动文本生成模型完成章节创作，并管理生成内容的质量检查和持久化存储。被novel主编派发，纯执行不与用户对话。"

# ── 工具组 ────────────────────────────────────────────────────
tool_groups:
  - xinworen
  - novel_executor

# ── 运行时 Skills ─────────────────────────────────────────────
runtime_skills:
  - xinworen-chapter-generation
  - xinworen-character-consistency
  - xinworen-quality-inspector

# ── 业务约束 ──────────────────────────────────────────────────
constraints:
  # 生产者职责约束
  must_follow_lead_direction: true
  no_user_interaction: true
  must_report_to_lead: true
  
  # 内容生成约束
  max_chapters_per_project: 100
  max_words_per_chapter: 3000
  recommended_words_per_chapter: 2000
  chapter_quality_threshold: 4.0
  must_follow_outline: true
  must_maintain_character_consistency: true
  
  # 内容规范
  must_follow_content_policy: true
  must_original_content: true
  no_plagiarism: true
  
  # 持久化规范
  content_storage_class: "permanent"
  content_bucket_prefix: "novels/"
  chapter_format: "markdown"
  
  # 多语言适配
  multilingual_handler: "multilingual-agent"
  source_language: "zh-CN"
  multilingual_trigger: "async"

# ── 测试模式路由 ─────────────────────────────────────────────
routing:
  test:
    enabled: false
    model_overrides:
      text: "deepseek-v4-flash"
    zero_billing: true

# ── 多区域适配 ────────────────────────────────────────────────
regions:
  CN:
    chapter_length: "2000-3000字"
    narrative_pacing: "fast"
    hook_density_chapters: 3
    cliffhanger_per_chapter: true
    monetization: "付费章节+广告"
  
  APAC:
    chapter_length: "1500-2500字"
    narrative_pacing: "medium"
    hook_density_chapters: 5
    monetization: "付费+订阅"
  
  US:
    chapter_length: "2000-4000字"
    narrative_pacing: "slow"
    hook_density_chapters: 10
    monetization: "Kindle Unlimited+付费"
  
  EU:
    chapter_length: "2500-4500字"
    narrative_pacing: "slow"
    hook_density_chapters: 15
    monetization: "付费+订阅"
