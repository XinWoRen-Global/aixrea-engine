# ═══════════════════════════════════════════════════════════════
# novel-executor Agent 配置
# 对标起点中文网/番茄小说/七猫：4 相位线性执行器
# ═══════════════════════════════════════════════════════════════

name: novel-executor
model: agnes-2.0-flash
description: "新我人创作中心 · 剧本/小说线性执行器（4 步线性流）。收到 album_id 后按 analyze→draft→polish→compose 固定顺序调用相位工具，全程不与用户对话，跑完汇报结果。工具直接调用自有管线 API，零外部工具费用。多语言适配由独立 multilingual Agent 处理。"

# ── 工具组 ────────────────────────────────────────────────────
tool_groups:
  - novel_executor

# ═══════════════════════════════════════════════════════════════
# 商业化小说/剧本约束（对标起点中文网/番茄小说/七猫头部作品标准）
# 所有约束在运行时由 agent + tools.py 共同校验
# ═══════════════════════════════════════════════════════════════

constraints:
  # ── 内容规范 ──
  min_words_per_chapter: 2000             # 每章最少字数
  recommended_words_per_chapter_min: 3000 # 建议字数下限
  recommended_words_per_chapter_max: 5000 # 建议字数上限
  long_form_chapters_min: 80              # 长篇最少章节数
  long_form_chapters_max: 200             # 长篇最多章节数
  medium_form_chapters_min: 20            # 中篇最少章节数
  medium_form_chapters_max: 50            # 中篇最多章节数
  required_chapter_sections:              # 每章必需内容
    - scene_description
    - character_dialogue
    - inner_monologue
    - action_progression
  required_chapter_arc:                   # 每章结构
    - opening_hook
    - conflict
    - escalation
    - mini_climax
    - cliffhanger_ending
  golden_200_words_hook: true             # 前 200 字黄金钩子
  mini_peaks_per_chapter_min: 2           # 每章最少小爽点数
  mini_peaks_per_chapter_max: 3           # 每章最多小爽点数
  major_peaks_interval_min: 5             # 每 5 章一个大爽点
  major_peaks_interval_max: 10            # 每 10 章一个大爽点
  first_paywall_chapter: 10               # 第 10 章第一个付费钩子（对标起点/番茄免费试读7-10章）
  paywall_interval: 10                    # 之后每 8-10 章一个付费钩子
  emotion_waves_per_chapter_min: 1        # 每章最少情绪波动
  emotion_waves_per_chapter_max: 2        # 每章最多情绪波动
  compliance_red_lines:                   # 合规红线（一票否决）
    - no_glorifying_crime
    - no_money_worship
    - no_vulgar_content
    - no_underage_romance
    - no_political_sensitivity
    - positive_values_ending

  # ── 文学规范 ──
  narrative_perspective: "consistent"     # 全书统一视角（第一人称或第三人称）
  dialogue_format: "quoted_indented"      # 引号引用，每段独立成行
  max_lines_per_paragraph: 5              # 每段最多 5 行
  max_lines_per_dialogue_paragraph: 3     # 对话段落最多 3 行
  chapter_end_cliffhanger: true           # 章节结尾必留悬念

  # ── 人物规范 ──
  max_main_characters: 2                  # 主角最多 2 个
  max_supporting_characters: 10           # 主要配角最多 10 个
  max_total_characters: 30                # 总角色最多 30 个
  character_dimensions:                   # 人设五维
    - identity
    - ability
    - personality
    - goal
    - flaw
  villain_motivation_required: true       # 反派必须有合理动机

  # ── 资产规范 ──
  cover_image_per_book: 1                 # 每本书 1 张封面
  illustration_per_chapters: 10           # 每 10 章 1 张插图（可选）
  asset_binding: "album_id"               # 资产绑定方式（project_id = album_id）
  asset_storage_class: "buffer"           # 默认 buffer（30 天 lifecycle）

  # ── 多语言适配 ──
  multilingual_handler: "multilingual-agent"  # 多语言由独立 Agent 处理
  source_language: "zh-CN"                    # 源语言
  multilingual_trigger: "async"               # 合成完成后异步触发

# ═══════════════════════════════════════════════════════════════
# 多区域适配（Region-Specific Overrides）
# 全球 6 大区：CN / APAC / US / EU / MENA / LATAM
# ═══════════════════════════════════════════════════════════════

regions:
  CN:
    min_words_per_chapter: 2000
    recommended_words_per_chapter_min: 3000
    recommended_words_per_chapter_max: 5000
    long_form_chapters_min: 80
    long_form_chapters_max: 200
    narrative_perspective: "consistent"      # 统一视角
    first_paywall_chapter: 10
    best_seller_genres: ["xianxia", "urban", "romance", "system", "rebirth"]

  APAC:
    min_words_per_chapter: 1500
    recommended_words_per_chapter_min: 2500
    recommended_words_per_chapter_max: 5000
    long_form_chapters_min: 40
    long_form_chapters_max: 80
    narrative_perspective: "first_person"
    first_paywall_chapter: 10
    best_seller_genres: ["romance", "fantasy", "litrpg", "horror"]

  US:
    min_words_per_chapter: 1500
    recommended_words_per_chapter_min: 2500
    recommended_words_per_chapter_max: 5000
    long_form_chapters_min: 40
    long_form_chapters_max: 80
    narrative_perspective: "first_person"
    first_paywall_chapter: 10
    best_seller_genres: ["sci_fi", "fantasy", "romance", "thriller", "litrpg"]

  EU:
    min_words_per_chapter: 1500
    recommended_words_per_chapter_min: 2000
    recommended_words_per_chapter_max: 4000
    long_form_chapters_min: 30
    long_form_chapters_max: 60
    narrative_perspective: "third_person"    # 欧洲文学第三人称偏好
    first_paywall_chapter: 10
    best_seller_genres: ["crime", "historical", "literary_fiction", "sci_fi"]

  MENA:
    min_words_per_chapter: 1000
    recommended_words_per_chapter_min: 1500
    recommended_words_per_chapter_max: 3000
    long_form_chapters_min: 20
    long_form_chapters_max: 50
    narrative_perspective: "third_person"
    first_paywall_chapter: 10
    best_seller_genres: ["romance", "family_drama", "historical", "religious"]

  LATAM:
    min_words_per_chapter: 1200
    recommended_words_per_chapter_min: 2000
    recommended_words_per_chapter_max: 4000
    long_form_chapters_min: 30
    long_form_chapters_max: 60
    narrative_perspective: "first_person"
    first_paywall_chapter: 12
    best_seller_genres: ["romance", "telenovela", "fantasy", "mystery"]