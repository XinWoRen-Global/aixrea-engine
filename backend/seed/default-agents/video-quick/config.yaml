# ═══════════════════════════════════════════════════════════════
# video-quick Agent 配置（单步视频直出 · Tier1 quick 人格）
# 对标蓝图 Phase 3/4：把单步视频从 Gateway 直出收敛到统一 Agent 底座。
# 本轮仅建骨架（SOUL.md + config.yaml），不接入 agent-mapping，
# 待 pipeline 执行引擎就绪后再启用（避免死注册）。
# ═══════════════════════════════════════════════════════════════

name: video-quick
model: agnes-2.0-flash
description: "新我人创作中心 · 单步视频直出 Agent（quick 模式）。接收 prompt 与参考素材，单次调用生成一段竖屏视频并汇报结果。非聊天型，不做对话、不做多步 DAG；与 drama-executor（4 相位 album 流）互补。视频能力由 Gateway MultiVendorPool（volcengine/Ark 主 + agnes 兜底）提供。"

# ── 工具组 ─────────────────────────────────────────────────────
tool_groups:
  - video_quick

# ── Skills ─────────────────────────────────────────────────────
# 不做 skills 白名单：缺省加载全部启用的技能（详见 SOUL.md Seed 章节，
# 运行时按需调用 xinworen-character-seed）。设白名单会错误地限死其它技能。

# ── 约束 ───────────────────────────────────────────────────────
constraints:
  single_shot: true                 # 单步直出，禁止多相位 DAG
  requires_album_id: false          # 单步无 album 归属（album_id=null）
  output_asset_type: "video"        # 产出视频资产
  provider: "MultiVendorPool"       # 统一走 Gateway 多厂商池
  region_routing: true              # 按客户端区域路由
  circuit_breaker: true             # 厂商故障自动熔断/降级
  default_duration: 5               # 默认时长(2s-15s)
  default_resolution: "720p"
  default_aspect_ratio: "9:16"
  reference_images_max: 9           # 参考图上限
  reference_videos_max: 1           # 参考视频上限
  reference_audios_max: 1           # 参考音频上限

  # ── Seed 一致性（角色/场景/道具变体） ──
  seed_enabled: true                # 启用 Seed 变体能力
  seed_skill: "xinworen-character-seed"  # 复用工建 Seed Skill
  seed_inject: "minimal_high_signal"     # 注入最小高信号子集（每角色 1 三视图 + 1 变体 + 1 场景/道具）
  seed_first_frame_from_identity: true   # identity 最佳三视图优先作 first_frame
  seed_similarity_threshold: 0.82   # 底图 vs 成片一致性回检阈值
  seed_retry_once: true             # 回检不达标重试 1 次（换参/强化描述）
  seed_no_identity_fallback: "L1_prompt"  # 无 Seed 时走提示词锚定（L1）