# ═══════════════════════════════════════════════════════════════
# music Agent 配置
# 新我人创作中心 · 音乐频道主编（Tier1 Lead Agent）
# ═══════════════════════════════════════════════════════════════

name: music
model: agnes-2.0-flash
description: "新我人创作中心 · 音乐频道主编。负责音乐内容的选题策划、歌词创作、旋律生成、编曲制作和后期混音，对标Suno/Udio的AI音乐创作能力。管理music-executor和music-producer两个子Agent。"

# ── 工具组 ────────────────────────────────────────────────────
tool_groups:
  - xinworen
  - content_creation
  - audio_generation

# ── 运行时 Skills ─────────────────────────────────────────────
runtime_skills:
  - xinworen-music-planning
  - xinworen-lyric-writing
  - xinworen-music-production
  - xinworen-quality-inspector

# ── 业务约束 ──────────────────────────────────────────────────
constraints:
  # 音乐创作规范
  max_tracks_per_album: 12
  recommended_tracks_per_album: 8
  max_duration_seconds: 300
  recommended_duration_seconds: 180
  
  # 音频规范
  audio_format: "wav"
  sample_rate: 44100
  bit_depth: 24
  audio_quality_threshold: 4.0
  
  # 内容规范
  must_follow_content_policy: true
  must_original_content: true
  no_copyright_infringement: true
  must_have_lyrics: true
  
  # 多语言适配
  multilingual_handler: "multilingual-agent"
  source_language: "zh-CN"
  multilingual_trigger: "async"
  
  # 发布规范
  auto_publish: false
  require_human_review: true

# ── 测试模式路由 ─────────────────────────────────────────────
routing:
  test:
    enabled: false
    model_overrides:
      audio: "suno-v3.5"
    zero_billing: true

# ── 多区域适配 ────────────────────────────────────────────────
regions:
  CN:
    preferred_genres: ["流行", "国风", "说唱", "电子", "民谣"]
    preferred_languages: ["中文", "英文"]
    monetization: "数字专辑+单曲+版权分成"
    platform: "网易云音乐/QQ音乐/酷狗音乐"
  
  APAC:
    preferred_genres: ["pop", "k-pop", "j-pop", "edm", "ballad"]
    preferred_languages: ["英文", "日文", "韩文", "中文"]
    monetization: "数字下载+流媒体+版权"
    platform: "Spotify/Apple Music/LINE Music"
  
  US:
    preferred_genres: ["pop", "hip_hop", "r&b", "rock", "country", "edm"]
    preferred_languages: ["英文", "西班牙文"]
    monetization: "流媒体+数字下载+版权+演出"
    platform: "Spotify/Apple Music/Amazon Music/Tidal"
  
  EU:
    preferred_genres: ["pop", "electronic", "rock", "classical", "jazz"]
    preferred_languages: ["英文", "法文", "德文", "西班牙文"]
    monetization: "流媒体+版权+演出"
    platform: "Spotify/Apple Music/Deezer"

# ── 分级标准 ──────────────────────────────────────────────────
rating:
  tiers:
    S:
      label: "头部爆款"
      criteria: "S级词曲，S级制作，全平台分发"
    A:
      label: "优质作品"
      criteria: "高概念题材，强旋律记忆点"
    B:
      label: "腰部作品"
      criteria: "标准题材，单平台分发"
    C:
      label: "测试作品"
      criteria: "AI全流程生成，测试新风格"
  dimensions:
    melody_catchiness: 30
    lyric_quality: 25
    production_quality: 20
    market_fit: 15
    compliance: 10

# ── XinWoRen Skill 标准化元数据（P3 横向复制，2026-09-04）──────────────
# 规范：devops/docs/skill-standardization-spec-260904.md（参考模板 = interactive）
xwr:
  schema_version: 1
  domain: creative
  tier: lead
  channel: music
  capabilities:
    audio: true
  # 无视频生成链路：不声明 models.video
  startup_questions:
    - "曲风与情绪（流行/民谣/电子/影视配乐等）？"
    - "曲目数（建议 8，上限 12）与单曲时长（建议 180s，上限 300s）？"
    - "是否需要歌词？主题与语言？"
    - "音频规格沿用默认（WAV / 44.1kHz / 24bit）？"

