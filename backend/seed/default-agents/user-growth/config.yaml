# ═══════════════════════════════════════════════════════════════
# user-growth Agent 配置
# 新我人用户增长域 · 用户增长主编（Tier1 Lead Agent）
# ═══════════════════════════════════════════════════════════════

name: user-growth
model: agnes-2.0-flash
description: "新我人用户增长域 · 用户增长主编。负责用户获取、激活、留存、转化和推荐的全链路增长策略，管理获客、留存、推荐三个子Agent，对标字节跳动/腾讯的用户增长能力。"

# ── 工具组 ────────────────────────────────────────────────────
tool_groups:
  - xinworen
  - growth
  - analytics

# ── 运行时 Skills ─────────────────────────────────────────────
runtime_skills:
  - xinworen-user-acquisition
  - xinworen-user-retention
  - xinworen-recommendation-engine
  - xinworen-growth-analytics

# ── 业务约束 ──────────────────────────────────────────────────
constraints:
  # 增长目标
  north_star_metric: "monthly_active_creators"
  key_metrics: ["DAU", "MAU", "retention_rate", "conversion_rate", "LTV"]
  
  # 获客规范
  acquisition_channels: ["seo", "sem", "social_media", "content_marketing", "referral", "partnership"]
  max_cac_usd: 50.00
  must_track_attribution: true
  
  # 激活规范
  activation_event: "first_content_creation"
  activation_window_days: 7
  onboarding_flow_enabled: true
  
  # 留存规范
  retention_days: [1, 7, 30, 90]
  target_d1_retention: 0.40
  target_d7_retention: 0.20
  target_d30_retention: 0.10
  
  # 转化规范
  conversion_funnel: ["visitor", "registered", "activated", "paid", "loyal"]
  target_paid_conversion: 0.05
  
  # 推荐规范
  recommendation_enabled: true
  personalization_enabled: true
  must_provide_explanations: true
  
  # 多语言适配
  multilingual_handler: "multilingual-agent"
  source_language: "zh-CN"
  multilingual_trigger: "async"

# ── 测试模式路由 ─────────────────────────────────────────────
routing:
  test:
    enabled: false
    model_overrides:
      text: "deepseek-v4-flash"
    zero_billing: true

# ── 多区域适配 ────────────────────────────────────────────────
regions:
  CN:
    acquisition_channels: ["抖音", "微信", "微博", "小红书", "B站", "SEO"]
    social_platforms: ["wechat", "weibo", "douyin", "xiaohongshu", "bilibili"]
  
  APAC:
    acquisition_channels: ["TikTok", "Instagram", "Facebook", "YouTube", "SEO"]
    social_platforms: ["tiktok", "instagram", "facebook", "youtube"]
  
  US:
    acquisition_channels: ["Google", "YouTube", "TikTok", "Instagram", "Reddit", "SEO"]
    social_platforms: ["youtube", "tiktok", "instagram", "reddit", "twitter"]
  
  EU:
    acquisition_channels: ["Google", "YouTube", "TikTok", "Instagram", "SEO"]
    social_platforms: ["youtube", "tiktok", "instagram", "twitter"]
