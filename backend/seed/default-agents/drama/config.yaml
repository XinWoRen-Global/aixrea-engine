# ═══════════════════════════════════════════════════════════════
# drama Agent 配置
# 新我人创作中心 · 短剧/视频频道主编（Tier1 Lead，面向用户对话）
# ═══════════════════════════════════════════════════════════════

name: drama
model: agnes-2.0-flash
description: "新我人创作中心 · 短剧/视频频道主编。负责把用户的短剧创意拆解为可执行的视频生产流程（剧本导入→分析→风格选择→资产生成→分镜→视频生成→合成导出），并在需要时派发 drama-producer 子代理完成资产生成与合成。面向用户对话，可派生子代理。"

# ── 工具组 ────────────────────────────────────────────────────
tool_groups:
  - xinworen
  - drama_executor

# ── 运行时 Skills ─────────────────────────────────────────────
runtime_skills:
  - xinworen-pipeline-execution
  - xinworen-character-seed
  - xinworen-quality-inspector

# ── 业务约束 ──────────────────────────────────────────────────
constraints:
  # 主编职责约束
  max_concurrent_projects: 5              # 最多同时管理5个项目
  must_confirm_script: true                # 必须确认剧本后才能继续
  must_confirm_assets: true                # 必须确认资产后才能生成视频
  
  # 内容规范（与drama-executor对齐）
  min_script_words_per_episode: 500
  recommended_script_words_per_episode: 700
  required_script_sections:
    - scene_description
    - character_dialogue
    - action_direction
    - emotion_annotation
  required_story_arc: true
  golden_3_second_hook: true
  hook_density_seconds: 15
  compliance_red_lines:
    - no_glorifying_crime
    - no_money_worship
    - no_vulgar_content
    - no_underage_romance
    - positive_values_ending
  
  # 资产规范
  max_characters: 8
  recommended_characters: 5
  max_scenes: 10
  preferred_scene_type: "indoor"
  
  # 视频规范
  default_resolution: "720p"
  default_aspect_ratio: "9:16"
  segment_reference_required: true
  
  # 合成规范
  add_subtitles: true
  add_background_music: true
  output_format: "mp4"
  
  # 多语言适配
  multilingual_handler: "multilingual-agent"
  source_language: "zh-CN"
  multilingual_trigger: "async"

# ── 测试模式路由 ─────────────────────────────────────────────
routing:
  test:
    enabled: false
    model_overrides:
      video: "agnes-video-v2.0"
      image: "agnes-image-2.1-flash"
    zero_billing: true

# ── 多区域适配 ────────────────────────────────────────────────
regions:
  CN:
    episode_duration_seconds: 60
    episode_duration_max: 90
    narrative_pacing: "fast"
    golden_3_second_hook: true
    hook_density_seconds: 15
    default_aspect_ratio: "9:16"
    preferred_formats: ["vertical_short_video"]
    best_seller_genres: ["urban_romance", "ancient_costume", "rebirth", "president_ceo", "sweet_romance"]
    pricing_tier: "tier_1"
  
  APAC:
    episode_duration_seconds: 50
    episode_duration_max: 70
    narrative_pacing: "moderate"
    golden_3_second_hook: true
    hook_density_seconds: 18
    default_aspect_ratio: "9:16"
    preferred_formats: ["vertical_short_video", "horizontal_short_video"]
    best_seller_genres: ["romance", "fantasy", "horror", "comedy"]
    cultural_sensitive_topics: ["religion", "royalty", "historical_figures"]
    pricing_tier: "tier_2"
  
  US:
    episode_duration_seconds: 45
    episode_duration_max: 60
    narrative_pacing: "moderate"
    golden_3_second_hook: true
    hook_density_seconds: 20
    default_aspect_ratio: "16:9"
    preferred_formats: ["horizontal_short_video", "vertical_short_video"]
    best_seller_genres: ["sci_fi", "horror", "thriller", "romance", "superhero"]
    cultural_sensitive_topics: ["race", "gender", "politics", "religion"]
    pricing_tier: "tier_1"
  
  EU:
    episode_duration_seconds: 40
    episode_duration_max: 60
    narrative_pacing: "slow_burn"
    golden_3_second_hook: false
    hook_density_seconds: 25
    default_aspect_ratio: "16:9"
    preferred_formats: ["horizontal_short_video"]
    best_seller_genres: ["drama", "crime", "historical", "sci_fi"]
    cultural_sensitive_topics: ["religion", "immigration", "politics", "historical_events"]
    multilingual_support: true
    pricing_tier: "tier_1"
  
  MENA:
    episode_duration_seconds: 50
    episode_duration_max: 75
    narrative_pacing: "moderate"
    golden_3_second_hook: true
    hook_density_seconds: 18
    reading_direction: "rtl"
    default_aspect_ratio: "16:9"
    preferred_formats: ["horizontal_short_video"]
    best_seller_genres: ["romance", "family_drama", "historical", "comedy"]
    cultural_sensitive_topics: ["religion", "gender_roles", "politics", "alcohol", "dating"]
    content_moderation: "strict"
    pricing_tier: "tier_2"
  
  LATAM:
    episode_duration_seconds: 55
    episode_duration_max: 80
    narrative_pacing: "fast"
    golden_3_second_hook: true
    hook_density_seconds: 16
    default_aspect_ratio: "9:16"
    preferred_formats: ["vertical_short_video", "horizontal_short_video"]
    best_seller_genres: ["telenovela", "romance", "comedy", "supernatural"]
    cultural_sensitive_topics: ["religion", "politics", "crime"]
    pricing_tier: "tier_3"

# ── 分级标准 ──────────────────────────────────────────────────
rating:
  tiers:
    S:
      label: "头部爆款"
      guarantee_cny: 50000
      guarantee_max_cny: 200000
      revenue_share_pct: 20
      criteria: "IP 改编/自带流量，S 级编剧，全平台分发"
    A_plus:
      label: "准爆款"
      guarantee_cny: 30000
      guarantee_max_cny: 70000
      revenue_share_pct: 20
      criteria: "高概念题材，强付费点，多平台分发"
    A:
      label: "腰部潜力"
      guarantee_cny: 10000
      guarantee_max_cny: 50000
      revenue_share_pct: 20
      criteria: "标准题材，单平台主推"
    B:
      label: "腰部走量"
      guarantee_cny: 0
      revenue_share_pct: 10
      criteria: "填充内容库，走量"
    C:
      label: "底部测试"
      guarantee_cny: 0
      revenue_share_pct: 0
      criteria: "AI 全流程生成，测试新题材"
  dimensions:
    rhythm_density: 30
    paywall_design: 25
    character_appeal: 20
    producibility: 15
    compliance: 10

# ── XinWoRen Skill 标准化元数据（P3 横向复制，2026-09-04）──────────────
# 规范：devops/docs/skill-standardization-spec-260904.md（参考模板 = interactive）
xwr:
  schema_version: 1
  domain: creative
  tier: lead
  channel: reels
  capabilities:
    video: true
  models:
    video:
      # 档位映射与 credits_engine.py 对齐：fast=seedance-2-mini /
      # standard=wan3.0-video / full=seedance-2-5；未显式配模型时走 fast 档。
      supported: [seedance-2-mini, seedance-2-5, wan3.0-video]
      default: seedance-2-mini
      # 🚨 MiniMax H3 系不入短剧（SSOT：frontend minimax-spec.ts）：
      # 单段上限 15s < 短剧 30s 场景；H3 Max 在 A/B 实测达标前禁止扩大到
      # 短剧等叙事场景（现行决策 decision-minimax-h3-sku-tiering-260904.md）。
  startup_questions:
    - "题材与风格（都市/古风/悬疑/甜宠等）？"
    - "集数与单集时长（各区 constraints 40-90 秒）？"
    - "视频模型档位：fast（seedance-2-mini）/ standard（wan3.0-video）/ full（seedance-2-5）？"
    - "角色数量，以及是否复用资产中心已有角色（Seed 一致性）？"

