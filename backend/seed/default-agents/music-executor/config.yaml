# ═══════════════════════════════════════════════════════════════
# music-executor Agent 配置
# 对标网易云音乐/QQ音乐/Spotify：3 相位线性执行器
# ═══════════════════════════════════════════════════════════════

name: music-executor
model: agnes-2.0-flash
description: "新我人创作中心 · 音乐线性执行器（3 步线性流）。收到 album_id 后按 analyze→assets→compose 固定顺序调用相位工具，全程不与用户对话，跑完汇报结果。工具直接调用自有管线 API，零外部工具费用。多语言适配由独立 multilingual Agent 处理。"

# ── 工具组 ────────────────────────────────────────────────────
tool_groups:
  - music_executor

# ── 运行时加载的 Skills（SKILL.md 合并为执行器规则源，按域隔离） ─────────
# 架构规范：每个执行器声明自己的 SKILL.md，执行引擎按名读取归档到运行时真理源。
# 音乐执行器只启用音乐的 SKILL，绝不加载剧本/漫画/互动等其他域的 SKILL（防串模）。
runtime_skills:
  - xinworen-pipeline-execution   # 通用管线执行协议（首轮推荐块 → 等确认 → task 派发、幂等重入）
  - xinworen-music-album          # 音乐专辑作业规范（歌词三观/曲式结构/音频规格/Suno 出片）
  - xinworen-suno-music           # Suno 出片执行规范（prompt→生成→成品交回）

# ═══════════════════════════════════════════════════════════════
# 商业化音乐约束（对标网易云音乐/QQ音乐/Spotify 热门作品标准）
# 所有约束在运行时由 agent + tools.py 共同校验
# ═══════════════════════════════════════════════════════════════

constraints:
  # ── 歌词规范（含中英文差异） ──
  lyrics_chinese_chars_min: 200           # 中文歌词最少字数
  lyrics_chinese_chars_max: 500           # 中文歌词最多字数
  lyrics_english_words_min: 150           # 英文歌词最少词数
  lyrics_english_words_max: 400           # 英文歌词最多词数
  chinese_perspective: "first_person"     # 中文歌词以第一人称"我"为主
  chinese_pov: "narrator"                # 主人公 = 讲述者
  english_perspective: "first_person_flexible"  # 英文歌词 I/You 交替
  english_pov: "narrator_dialoguer"      # 主人公 = 叙述者/对话者
  chinese_rhyme: "at_least_alternating"  # 中文至少隔句押韵
  english_rhyme: "optional"              # 英文押韵可选
  chinese_cultural_localization: true     # 中文歌词用中文文化语境
  english_natural_expression: true        # 英文歌词用母语者自然表达
  compliance_red_lines:                   # 合规红线（一票否决）
    - no_sexual_innuendo
    - no_violent_lyrics
    - no_political_sensitivity
    - no_plagiarism

  # ── 歌词结构 ──
  song_structure:                         # 标准流行曲结构
    - verse_1
    - verse_2
    - chorus_1
    - chorus_2
    - bridge
    - chorus_final
  verse_lines_min: 8                      # 主歌最少行数
  verse_lines_max: 16                     # 主歌最多行数
  verse_count: 2                          # 主歌段数
  chorus_lines_min: 4                     # 副歌最少行数
  chorus_lines_max: 8                     # 副歌最多行数
  chorus_repeat_min: 2                    # 副歌至少重复 2 次
  bridge_lines_min: 4                     # 桥段最少行数
  bridge_lines_max: 8                     # 桥段最多行数
  instrumental_sections_measures: 8       # 前奏/间奏/尾奏各 4-8 小节

  # ── 音频规范 ──
  duration_seconds_min: 150               # 最短时长 2:30
  duration_seconds_max: 240               # 最长时长 4:00
  short_version_duration_seconds: 90      # 短视频版本 1:30
  sample_rate: 44100                      # 44.1kHz CD 音质
  bitrate_mp3: 320                        # 320kbps MP3
  bitrate_wav: 1411                       # 1411kbps WAV
  loudness_lufs: -14                       # LUFS -14dB 流媒体标准
  output_formats:                          # 输出格式
    - "wav"
    - "mp3_320"

  # ── 封面规范 ──
  cover_width: 3000                       # 封面宽度 3000px
  cover_height: 3000                      # 封面高度 3000px
  cover_format: "jpeg_or_png"             # 封面格式 JPEG/PNG
  cover_has_design_elements: true         # 必须有设计元素，禁止纯文字

  # ── 资产规范 ──
  asset_binding: "album_id"               # 资产绑定方式（project_id = album_id）
  asset_storage_class: "buffer"           # 默认 buffer（30 天 lifecycle）

  # ── 多语言适配 ──
  multilingual_handler: "multilingual-agent"  # 多语言由独立 Agent 处理
  source_language: "zh-CN"                    # 源语言
  multilingual_trigger: "async"               # 合成完成后异步触发

# ═══════════════════════════════════════════════════════════════
# 多区域适配（Region-Specific Overrides）
# 全球 6 大区：CN / APAC / US / EU / MENA / LATAM
# ═══════════════════════════════════════════════════════════════

regions:
  CN:
    lyrics_perspective: "first_person"
    lyrics_pov: "narrator"
    lyrics_rhyme: "at_least_alternating"
    preferred_genres: ["pop", "ballad", "rock", "r&b"]
    song_structure: ["verse_1", "verse_2", "chorus_1", "chorus_2", "bridge", "chorus_final"]
    min_chars: 200
    max_chars: 500

  APAC:
    lyrics_perspective: "first_person_flexible"
    lyrics_pov: "narrator_dialoguer"
    lyrics_rhyme: "optional"
    preferred_genres: ["k-pop", "j-pop", "pop", "ballad", "anime_soundtrack"]
    song_structure: ["verse_1", "pre_chorus_1", "chorus_1", "verse_2", "pre_chorus_2", "chorus_2", "bridge", "chorus_final"]
    min_chars: 150
    max_chars: 400

  US:
    lyrics_perspective: "first_person_flexible"
    lyrics_pov: "narrator_dialoguer"
    lyrics_rhyme: "optional"
    preferred_genres: ["pop", "hip-hop", "country", "rock", "electronic"]
    song_structure: ["verse_1", "chorus_1", "verse_2", "chorus_2", "bridge", "chorus_final"]
    min_words: 150
    max_words: 400

  EU:
    lyrics_perspective: "first_person_flexible"
    lyrics_pov: "narrator"
    lyrics_rhyme: "optional"
    preferred_genres: ["electronic", "pop", "rock", "classical", "folk"]
    song_structure: ["verse_1", "chorus_1", "verse_2", "chorus_2", "bridge", "chorus_final"]
    min_words: 120
    max_words: 350
    multilingual_lyrics: true               # 欧洲多语言混写常见

  MENA:
    lyrics_perspective: "first_person"
    lyrics_pov: "narrator"
    lyrics_rhyme: "required"                # 阿拉伯音乐押韵严格
    preferred_genres: ["arabic_pop", "khaliji", "traditional", "electronic"]
    song_structure: ["verse_1", "chorus_1", "verse_2", "chorus_2", "chorus_final"]
    min_chars: 150
    max_chars: 400
    content_moderation: "strict"            # 歌词内容审核严格

  LATAM:
    lyrics_perspective: "first_person"
    lyrics_pov: "narrator"
    lyrics_rhyme: "at_least_alternating"    # 西班牙语押韵重要
    preferred_genres: ["reggaeton", "latin_pop", "bachata", "salsa", "trap_latino"]
    song_structure: ["verse_1", "chorus_1", "verse_2", "chorus_2", "bridge", "chorus_final"]
    min_chars: 150
    max_chars: 400