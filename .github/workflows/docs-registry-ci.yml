name: Docs Registry CI

# deer-flow/docs 导航中枢登记门禁。
# 规范：docs/README.md（任务路由中枢，跨会话 SSOT）；任何 docs 顶层或
# playbooks/ 下的 .md 必须在该 README 登记，漏登记 = 文档不可被发现。
# 校验器：scripts/check-docs-registry.mjs（纯 node:fs 零依赖，无需 install）
# 参照：frontend 的 api-response-audit 门禁（能力自动复用）；deer-flow 侧
# 因根目录无 package.json，直接 setup-node + node 运行，不做 guard:* 别名。
#
# paths 过滤：仅 docs/**、校验器自身、workflow 自身变更时触发——
# 纯文档改动无需驱动 backend 全量测试链，门禁独立、互不阻塞。

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check-docs-registry.mjs"
      - ".github/workflows/docs-registry-ci.yml"
  workflow_dispatch:
concurrency:
  group: docs-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-docs-registry:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run docs registry gate
        run: node scripts/check-docs-registry.mjs
