name: build-push-deploy-deerflow

# 大厂 CI/CD 模型（对齐 XinWoRen 部署规范 2026-08-26，v3 改用 GitHub Container Registry）：
#   ① push main → GitHub Actions 构建后端镜像并推到 ghcr.io
#      （免费；推送用内置 GITHUB_TOKEN，零额外密钥，无需阿里云账号）
#   ② CI 内 SSH 进 VPS 执行 pull + up -d，并做 /health + /ok 健康检测
#   ③ 检测失败自动回滚到上一个 :<sha> 镜像（秒级），不依赖人工
#   注：VPS 磁盘清理独立为 crontab 夜间任务（安装用 scripts/install-crontab.sh 安全追加，不跟每次部署绑死）。
#
# 需要的仓库 Secrets（在 GitHub repo Settings → Secrets and variables → Actions 配置）：
#   secrets.VPS_HOST     47.80.63.114
#   secrets.VPS_USER     root
#   secrets.VPS_SSH_KEY  VPS 私钥（deploy 专用，建议 ed25519）
#   secrets.GHCR_PAT     具备 read:packages 权限的 GitHub PAT（供 VPS 拉取私有镜像）
#   secrets.GHCR_USERNAME（可选）企业 org 场景下 PAT 持有者用户名≠org 名时设置；不填则默认用 org 名登录
#   （推送 ghcr.io 用内置 GITHUB_TOKEN，无需任何阿里云 ACR_* 密钥）
#
# 背景：原方案用阿里云 ACR 个人版（免费），但经核实个人版仅限「个人实名」账号，
# 企业实名账号（本项目）无法创建，控制台默认跳企业版且需包月付费。故改用 ghcr.io，
# 对本项目零增量成本、且保留「构建搬离 VPS + 自动部署 + 回滚」全部收益。

on:
  workflow_dispatch:
  # 2026-09-18: 改为手动触发，管理员核实 CI 绿后再点 deploy

permissions:
  contents: read
  packages: write   # 允许内置 GITHUB_TOKEN 推送镜像到 ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (gateway + langgraph 共用同一镜像，仅 CMD 不同)
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-8)
          REG="ghcr.io/${{ github.repository_owner }}"
          docker buildx build --platform linux/amd64 \
            -f backend/Dockerfile --build-arg UV_EXTRAS=postgres \
            -t "$REG/deerflow-backend:$SHORT" -t "$REG/deerflow-backend:latest" \
            -t "$REG/deerflow-langgraph:$SHORT" -t "$REG/deerflow-langgraph:latest" \
            --push .

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      GHCR_OWNER: ${{ github.repository_owner }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH deploy (healthcheck + auto-rollback)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          envs: GHCR_PAT,GHCR_OWNER,GHCR_USERNAME
          script: |
            set -e
            cd /opt/xinworen/deer-flow
            git pull --ff-only origin main || true
            SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
            GHCR_PAT="$GHCR_PAT" \
            GHCR_OWNER="$GHCR_OWNER" \
            GHCR_USERNAME="$GHCR_USERNAME" \
            bash scripts/vps-deploy.sh "$SHORT"
